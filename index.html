<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReChat - Real-time Chat Application</title>
    <script defer src="http://localhost:8000/socket.io/socket.io.js"></script>
    <script defer src="./js/client.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <img class="logo" src="./logo.png" alt="ReChat Logo">
    <div class="container">
        <img class="input-img hide right" id="main-img" src="./pexels-simeon-maryska-2003803697-30950764.jpg" alt="uploaded image">
        <!-- <div class="time">a</div> -->
    </div>
    <div class="send">
        <form action="#" id="send-container">
            <input type="text" name="messageInp" id="messageInp" placeholder="Type your message here..." required>
            <button type="submit">Send</button>
            <label for="input-img"><i class="fa-solid fa-paperclip" style="color: rgb(226, 226, 226);"></i></label>
            <input class="hide" type="file" id="input-img" accept="image/jpg, image/jpeg, image/png">
        </form>
    </div>
</body>

</html>
